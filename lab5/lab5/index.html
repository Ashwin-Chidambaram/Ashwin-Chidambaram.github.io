<!DOCTYPE html>
<html>
<head>
    <title>Bank Account</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="bank-card">
        <h2>Account Status</h2>
        <p>
            Account Balance:
            <span id="account-balance">$100</span>
        </p>
        <p id="deposit-withdraw-message">
            Ready to Deposit or Withdraw
        </p>
        <button onclick="depositMoney()">Deposit $30</button>
        <button onclick="withdrawMoney()">Withdraw $30</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
