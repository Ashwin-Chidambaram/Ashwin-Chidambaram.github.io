<!DOCTYPE html>
<html>
<head>
    <title>Bank Account</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="bank-card">
        <h2>Account Status</h2>
        <p>
            Account Balance:
            <span id="account-balance">$120</span>
        </p>
        <p id="deposit-withdraw-message">
            Ready to Deposit or Withdraw
        </p>
        <button id="deposit-button" onclick="depositMoney()"></button>
        <button id="withdraw-button" onclick="withdrawMoney()"></button>
    </div>
    <script src="script.js"></script>
</body>
</html>
