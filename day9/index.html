<!DOCTYPE html>
<html lang="en">

<head>
    <title>UofSC GameDay Checklist</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="main-header">
        <h1>GameDay Checklist</h1>
        <p>Get ready for GameDay at the University of South Carolina!</p>
    </header>

    <main>

        <section class="intro">
            <h2>My GameDay Checklist</h2>
            <p>Add everything you need to have before the game.</p>
        </section>

        <section id="checklist-section">

            <div class="input-area">
                <input type="text" id="taskInput" placeholder="Enter a GameDay task...">
                <button id="addButton">Add Task</button>
            </div>

            <ul id="taskList"></ul>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
