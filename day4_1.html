<!DOCTYPE html>

<html lang="en">

<head>
    <title>Table Example Day 4</title>
</head>

<body>

    <table>
        <thead>
            <tr>
                <th>Cell 1</th>
                <th>Cell 2</th>
                <th>Cell 3</th>                
            </tr>
        </thead>

                <td>Data 1</td>
                <td>Data 2</td>
                <td>Data 3</td>
        </tbody>

                <td>Foot 3</td>
        </tfoot>
    </table>

</body>

</html>
